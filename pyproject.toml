[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-destroyer"
version = "2.0.0"
description = "Build validated paired HR/LR video frame datasets"
requires-python = ">=3.10"
dependencies = [
  "scenedetect==0.6.6",
  "ffmpeg-python==0.2.0",
  "Pillow>=10.0.0",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "tqdm>=4.65.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6",
]

[project.scripts]
video-destroyer = "video_destroyer.cli:main"
video-destroyer-gui = "video_destroyer.gui:main"

[tool.setuptools.packages.find]
include = ["video_destroyer*", "utils*"]
